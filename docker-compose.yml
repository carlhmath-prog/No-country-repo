version: '3.9'

services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: govtech_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d govtech_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
    command: python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    # Host networking uses the workspace DNS and outbound route for OpenAI.
    network_mode: host
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: postgresql://user:password@host.docker.internal:5432/govtech_db
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-govtech-local-development-secret-change-before-deploy-2026}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
